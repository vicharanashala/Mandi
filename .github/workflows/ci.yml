name: CI Pipeline

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 mins - runs main.py only
  workflow_dispatch:
  push:
    branches:
      - main                  # on push - builds docker + runs everything

jobs:

  # ── JOB 1: Runs only on push ──────────────────────────────
  docker-build-and-run:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'   # ← only triggers on push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-app .

      - name: Run main.py in Docker
        run: |
          docker run --rm \
            -e MONGO_URI="${{ secrets.MONGO_URI }}" \
            -e MANDI_DB_NAME="${{ secrets.MANDI_DB_NAME }}" \
            -e MANDI_COLLECTION="${{ secrets.MANDI_COLLECTION }}" \
            my-app python main.py


  # ── JOB 2: Runs every 10 minutes ─────────────────────────
  scheduled-run:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run main.py
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MANDI_DB_NAME: ${{ secrets.MANDI_DB_NAME }}
          MANDI_COLLECTION: ${{ secrets.MANDI_COLLECTION }}
        run: python main.py