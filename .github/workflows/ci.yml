name: CI Pipeline

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # ── JOB 1: Runs only on push ──────────────────────────────
  docker-build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-app .

      - name: Run main.py in Docker
        run: |
          docker run --rm \
            -e MONGO_URI="${{ secrets.MONGO_URI }}" \
            -e MANDI_DB_NAME="${{ secrets.MANDI_DB_NAME }}" \
            -e PRICE_COLLECTION="${{ secrets.PRICE_COLLECTION }}" \
            -e MASTER_COLLECTION="${{ secrets.MASTER_COLLECTION }}" \
            -e MANDI_DB_NAME_ANNAM="${{ secrets.MANDI_DB_NAME_ANNAM }}" \
            -e COLLECTION_ANNAM="${{ secrets.COLLECTION_ANNAM }}" \
            -e ALL_MANDI_COLLECTION="${{ secrets.ALL_MANDI_COLLECTION }}" \
            -e AGMARKNET_CONCURRENCY=1 \
            -e AGMARKNET_PAGE_DELAY=3.0 \
            -e AGMARKNET_HTTP_RETRIES=6 \
            -e AGMARKNET_BACKOFF_BASE=15 \
            -e AGMARKNET_CONNECT_TIMEOUT=60 \
            -e AGMARKNET_READ_TIMEOUT=180 \
            -e AGMARKNET_STATE_DELAY=1.0 \
            -e AP_MARKET_RETRIES=5 \
            -e AP_MARKET_BACKOFF_BASE=15 \
            -e AP_MARKET_TIMEOUT=120 \
            my-app python main.py

  # ── JOB 2: Runs on schedule OR manual trigger ─────────────
  scheduled-run:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    if: github.event_name != 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-app .

      - name: Run main.py in Docker
        run: |
          docker run --rm \
            -e MONGO_URI="${{ secrets.MONGO_URI }}" \
            -e MANDI_DB_NAME="${{ secrets.MANDI_DB_NAME }}" \
            -e PRICE_COLLECTION="${{ secrets.PRICE_COLLECTION }}" \
            -e MASTER_COLLECTION="${{ secrets.MASTER_COLLECTION }}" \
            -e MANDI_DB_NAME_ANNAM="${{ secrets.MANDI_DB_NAME_ANNAM }}" \
            -e COLLECTION_ANNAM="${{ secrets.COLLECTION_ANNAM }}" \
            -e ALL_MANDI_COLLECTION="${{ secrets.ALL_MANDI_COLLECTION }}" \
            -e AGMARKNET_CONCURRENCY=2 \
            -e AGMARKNET_PAGE_DELAY=2.0 \
            -e AGMARKNET_HTTP_RETRIES=6 \
            -e AGMARKNET_BACKOFF_BASE=15 \
            -e AGMARKNET_CONNECT_TIMEOUT=60 \
            -e AGMARKNET_READ_TIMEOUT=180 \
            -e AGMARKNET_STATE_DELAY=1.0 \
            -e AP_MARKET_RETRIES=5 \
            -e AP_MARKET_BACKOFF_BASE=15 \
            -e AP_MARKET_TIMEOUT=120 \
            my-app python main.py
