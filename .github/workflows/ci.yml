name: CI Pipeline

on:
  schedule:
    - cron: '15 * * * *'   # every 10 mins
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # ── JOB 1: Runs only on push ──────────────────────────────
  docker-build-and-run:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-app .

      - name: Run main.py in Docker
        run: |
          docker run --rm \
            -e MONGO_URI="${{ secrets.MONGO_URI }}" \
            -e MANDI_DB_NAME="${{ secrets.MANDI_DB_NAME }}" \
            -e MANDI_COLLECTION="${{ secrets.MANDI_COLLECTION }}" \
            my-app python main.py

  # ── JOB 2: Runs on schedule OR manual trigger ─────────────
  scheduled-run:
    runs-on: ubuntu-latest
    if: github.event_name != 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-app .

      - name: Run main.py in Docker
        run: |
          docker run --rm \
            -e MONGO_URI="${{ secrets.MONGO_URI }}" \
            -e MANDI_DB_NAME="${{ secrets.MANDI_DB_NAME }}" \
            -e MANDI_COLLECTION="${{ secrets.MANDI_COLLECTION }}" \
            my-app python main.py